name: Selenium & Appium Automated E2E Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-testing-and-reporting:
    name: Run Selenium Web & Appium Mobile Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🌐 Install Google Chrome & Chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: 📱 Install Appium Server & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2@4.2.9
          appium --version

      - name: 📦 Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-test.txt

      - name: 🚀 Start LUNG-NET Web Dashboard Server (Background)
        run: |
          python -m streamlit run app_clinical_system.py --server.headless=true --server.port=8501 &
          echo "Waiting for Streamlit server to initialize..."
          sleep 5

      - name: 🚀 Start Appium Mobile Server (Background)
        run: |
          appium --port 4723 --log appium.log &
          echo "Waiting for Appium server to start..."
          sleep 5

      - name: 🧪 Execute Selenium Web & Appium Mobile E2E Test Suite
        env:
          TEST_BASE_URL: "http://localhost:8501"
          HEADLESS: "true"
          APPIUM_SERVER_URL: "http://127.0.0.1:4723"
          APK_PATH: "${{ github.workspace }}/LUNG-NET.apk"
        run: |
          python tests/run_tests_and_report.py || true

      - name: 📤 Upload Test Report Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-appium-test-report
          path: |
            test-reports/
            appium.log
          retention-days: 30
